name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bsa
          POSTGRES_PASSWORD: bsa
          POSTGRES_DB: bsa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bsa"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      BSA_ENV: development
      BSA_AUTH_PROVIDER: dev
      BSA_DATABASE_URL: postgresql+psycopg://bsa:bsa@localhost:5432/bsa
      BSA_TEST_DATABASE_URL: postgresql+psycopg://bsa:bsa@localhost:5432/bsa_test

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv venv --python 3.12
      - run: uv pip install -e ".[dev]"

      - name: Create test database
        run: PGPASSWORD=bsa psql -h localhost -U bsa -d bsa -c 'CREATE DATABASE bsa_test OWNER bsa;'

      - name: Lint
        run: .venv/bin/ruff check .

      - name: Format check
        run: .venv/bin/ruff format --check .

      - name: Type check
        run: .venv/bin/mypy

      # Migrations are applied to a real database here, which is why the test
      # suite is free to build its schema from the models instead.
      - name: Migrations apply and reverse
        run: |
          .venv/bin/alembic upgrade head
          .venv/bin/alembic downgrade base
          .venv/bin/alembic upgrade head

      - name: Migrations match the models
        run: |
          .venv/bin/alembic revision --autogenerate -m drift-check
          if grep -qE '^\s+op\.' alembic/versions/*drift_check.py; then
            echo "::error::Models have drifted from migrations. Generate a migration."
            cat alembic/versions/*drift_check.py
            exit 1
          fi
          rm alembic/versions/*drift_check.py

      - name: Tests
        run: .venv/bin/pytest -q

      - name: Seed runs end to end
        run: .venv/bin/python -m bsa.scripts.seed --reset --weeks 4

      - name: OpenAPI document is current
        run: |
          .venv/bin/python -m bsa.scripts.dump_openapi
          if ! git diff --quiet -- ../../packages/shared/openapi.json; then
            echo "::error::packages/shared/openapi.json is stale. Run: python -m bsa.scripts.dump_openapi"
            git --no-pager diff -- ../../packages/shared/openapi.json
            exit 1
          fi

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        working-directory: .

      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # The frontend's types are generated from the committed OpenAPI document.
      # A backend schema change that nobody regenerated must fail here rather
      # than surprise someone in the browser.
      - name: Generated API types are current
        run: |
          pnpm gen:api
          if ! git diff --quiet -- src/lib/api-types.ts; then
            echo "::error::src/lib/api-types.ts is stale. Run: pnpm --filter @bsa/web gen:api"
            git --no-pager diff --stat -- src/lib/api-types.ts
            exit 1
          fi

  images:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Built but not pushed: this proves the deployment path still works
      # without needing a registry or credentials in CI.
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
